<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Core — File Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     DESIGN TOKENS
     ========================================================== */
  :root{
    --void:#0a0e14;
    --panel: rgba(18,24,31,0.66);
    --panel-solid:#161d26;
    --line: rgba(228,235,241,0.09);
    --line-strong: rgba(228,235,241,0.18);
    --ink:#e4ebf1;
    --dim:#7c8a9c;
    --signal:#6ee7b0;
    --flag:#ff8966;
    --radius:14px;
    --radius-lg:18px;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --dur:200ms;
    --ease: cubic-bezier(.22,.61,.36,1);

    --c-folder:#e8b768;
    --c-audio:#b6a4f5;
    --c-video:#7dd3fc;
    --c-image:#6ee7b0;
    --c-text:#c9d3dc;
    --c-other:#7c8a9c;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0;
    height:100vh; height:100dvh;
    overflow:hidden;
    background:var(--void);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{ font-family:inherit; color:inherit; }
  button{ background:none; border:none; cursor:pointer; }
  ::selection{ background:var(--signal); color:#06110c; }

  /* ==========================================================
     BACKDROP
     ========================================================== */
  .bg{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(1200px 700px at 12% -10%, rgba(110,231,176,0.11), transparent 60%),
      radial-gradient(900px 620px at 112% 15%, rgba(255,137,102,0.09), transparent 55%),
      radial-gradient(1300px 900px at 50% 120%, rgba(37,48,64,0.55), transparent 60%),
      linear-gradient(180deg, #0a0e14 0%, #0d131b 50%, #0a0e14 100%);
    background-size:cover;
    background-position:center;
  }
  .bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(228,235,241,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(228,235,241,0.03) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image: radial-gradient(circle at 50% 25%, black, transparent 78%);
            mask-image: radial-gradient(circle at 50% 25%, black, transparent 78%);
  }
  .bg.has-image::after{ opacity:.5; }

  /* ==========================================================
     WINDOW
     ========================================================== */
  .window{
    position:relative;
    height:calc(100vh - 40px); height:calc(100dvh - 40px);
    max-height:760px;
    width:min(92vw, 720px);
    margin:20px auto 0;
    display:flex; flex-direction:column;
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-lg);
    box-shadow:0 24px 70px -24px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,0,0.25);
    overflow:hidden;
  }

  .win-head{
    flex:0 0 auto;
    display:flex; flex-wrap:wrap;
    align-items:center; gap:8px 12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .crumb-home{
    flex:0 0 auto;
    width:32px; height:32px;
    display:grid; place-items:center;
    border-radius:9px;
    color:var(--dim);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .crumb-home:hover{ color:var(--ink); background:rgba(228,235,241,0.06); }

  .breadcrumb{
    flex:1 1 140px; min-width:0;
    display:flex; align-items:center;
    overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
    font-family:var(--mono);
    font-size:13.5px;
  }
  .breadcrumb::-webkit-scrollbar{ display:none; }
  .crumb{
    flex:0 0 auto;
    padding:5px 6px;
    border-radius:6px;
    color:var(--dim);
    white-space:nowrap;
    transition:color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .crumb:hover:not(:disabled){ color:var(--ink); background:rgba(228,235,241,0.06); }
  .crumb.is-current{ color:var(--ink); font-weight:500; cursor:default; }
  .crumb-sep{ color:var(--dim); opacity:.5; flex:0 0 auto; display:flex; }
  .crumb-sep .icon-sm{ width:13px; height:13px; }
  .caret{
    display:inline-block; margin-left:2px; color:var(--signal);
    animation:blink 1.1s step-end infinite;
  }

  .win-actions{
    flex:1 1 220px;
    display:flex; align-items:center; gap:8px;
    justify-content:flex-end;
  }
  .search-wrap{
    flex:1 1 auto; min-width:100px; max-width:220px;
    display:flex; align-items:center; gap:6px;
    padding:6px 10px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--dim);
    transition:border-color var(--dur) var(--ease);
  }
  .search-wrap:focus-within{ border-color:var(--line-strong); color:var(--ink); }
  .search-wrap .icon-sm{ flex:0 0 auto; }
  .search-wrap input{
    flex:1 1 auto; min-width:0;
    background:none; border:none; outline:none;
    font-family:var(--mono); font-size:12.5px;
    color:var(--ink);
  }
  .search-wrap input::placeholder{ color:var(--dim); }

  .sort-select{
    flex:0 0 auto;
    padding:6px 8px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:9px;
    font-family:var(--mono); font-size:12px;
    color:var(--dim);
    max-width:118px;
  }
  .sort-select:focus{ outline:none; border-color:var(--line-strong); color:var(--ink); }

  /* ==========================================================
     GRID
     ========================================================== */
  .win-scroll{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(82px, 1fr));
    gap:20px 8px;
    padding:18px 16px 26px;
    opacity:0;
    transition:opacity 240ms var(--ease);
  }
  .grid.in{ opacity:1; }

  .tile{
    display:flex; flex-direction:column; align-items:center;
    gap:7px;
    padding:8px 4px 6px;
    border-radius:12px;
    text-align:center;
    color:var(--ink);
    position:relative;
    transition:background var(--dur) var(--ease);
  }
  .tile:hover, .tile:focus-visible{ background:rgba(228,235,241,0.05); }
  .tile:focus-visible{ outline:1.5px solid var(--signal); outline-offset:1px; }

  .tile-icon{
    position:relative;
    width:54px; height:54px;
    border-radius:14px;
    display:grid; place-items:center;
    background:color-mix(in srgb, currentColor 13%, transparent);
    border:1px solid color-mix(in srgb, currentColor 26%, transparent);
    overflow:hidden;
  }
  .tile[data-type="folder"] .tile-icon{ color:var(--c-folder); }
  .tile[data-type="audio"]  .tile-icon{ color:var(--c-audio); }
  .tile[data-type="video"]  .tile-icon{ color:var(--c-video); }
  .tile[data-type="image"]  .tile-icon{ color:var(--c-image); }
  .tile[data-type="text"]   .tile-icon{ color:var(--c-text); }
  .tile[data-type="other"]  .tile-icon{ color:var(--c-other); }
  .tile-icon img{ width:100%; height:100%; object-fit:cover; }
  .tile-icon .icon{ color:inherit; }

  .tile-icon::before{
    /* signature scan-line sweep, plays once on hover/focus */
    content:"";
    position:absolute; left:0; right:0; top:-30%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--signal), transparent);
    opacity:0;
  }
  @media (prefers-reduced-motion: no-preference){
    .tile:hover .tile-icon::before, .tile:focus-visible .tile-icon::before{
      animation:scan .6s var(--ease);
    }
  }

  .tile-badge{
    position:absolute; right:-3px; bottom:-3px;
    width:18px; height:18px;
    border-radius:50%;
    display:grid; place-items:center;
    background:var(--panel-solid);
    border:1.5px solid var(--void);
    color:var(--flag);
  }
  .tile-badge .icon-xs{ width:10px; height:10px; }

  .tile-label{
    font-family:var(--mono);
    font-size:11.5px;
    line-height:1.3;
    color:var(--dim);
    max-width:100%;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    line-clamp:2;
    overflow:hidden;
    word-break:break-word;
  }
  .tile:hover .tile-label, .tile:focus-visible .tile-label{ color:var(--ink); }

  .empty-state{
    margin:40px 20px;
    text-align:center;
    color:var(--dim);
    font-family:var(--mono);
    font-size:13px;
  }

  /* ==========================================================
     STATUS BAR (bottom-left)
     ========================================================== */
  .status-bar{
    position:fixed;
    left:calc(14px + env(safe-area-inset-left));
    bottom:calc(14px + env(safe-area-inset-bottom));
    z-index:40;
    display:flex; align-items:center; gap:8px;
    padding:7px 12px;
    background:var(--panel);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line-strong);
    border-radius:999px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--dim);
    max-width:calc(100vw - 28px);
  }
  .status-spinner{
    flex:0 0 auto;
    width:13px; height:13px;
    border-radius:50%;
    border:2px solid rgba(228,235,241,0.18);
    border-top-color:var(--signal);
    animation:spin .8s linear infinite;
    display:none;
  }
  .status-bar.is-loading .status-spinner{ display:block; }
  .status-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ==========================================================
     TOOLTIP
     ========================================================== */
  .tooltip{
    position:fixed; z-index:50;
    min-width:150px; max-width:240px;
    padding:10px 12px;
    background:var(--panel-solid);
    border:1px solid var(--line-strong);
    border-radius:10px;
    box-shadow:0 14px 34px -14px rgba(0,0,0,0.6);
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--dim);
    opacity:0;
    transform:translateY(4px);
    transition:opacity 160ms var(--ease), transform 160ms var(--ease);
    pointer-events:none;
  }
  .tooltip.show{ opacity:1; transform:translateY(0); }
  .tt-name{
    font-family:var(--sans); font-size:12.5px; font-weight:600;
    color:var(--ink); margin-bottom:5px;
    word-break:break-word;
  }
  .tt-type{
    display:inline-block; margin-bottom:6px;
    padding:1px 7px;
    border-radius:999px;
    background:rgba(228,235,241,0.08);
    color:var(--ink);
    font-size:10.5px; letter-spacing:.02em;
  }
  .tt-row{ display:flex; justify-content:space-between; gap:10px; padding:2px 0; }
  .tt-row span:first-child{ color:var(--dim); }
  .tt-row span:last-child{ color:var(--ink); text-align:right; }
  .tt-warn{
    display:flex; align-items:center; gap:6px;
    margin-top:6px; padding-top:6px;
    border-top:1px dashed var(--line-strong);
    color:var(--flag);
  }

  /* ==========================================================
     MODAL
     ========================================================== */
  .modal-backdrop{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(6,9,13,0.6);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    transition:opacity 220ms var(--ease);
  }
  .modal-backdrop.show{ opacity:1; }
  .modal-panel{
    width:min(92vw, 460px);
    max-height:86vh;
    display:flex; flex-direction:column;
    background:var(--panel-solid);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-lg);
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7);
    transform:translateY(10px) scale(.98);
    opacity:0;
    transition:transform 220ms var(--ease), opacity 220ms var(--ease);
  }
  .modal-backdrop.show .modal-panel{ transform:translateY(0) scale(1); opacity:1; }

  .modal-header{
    flex:0 0 auto;
    display:flex; align-items:center; gap:10px;
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .modal-icon{ flex:0 0 auto; width:32px; height:32px; display:grid; place-items:center; color:var(--dim); }
  .modal-icon .icon{ width:22px; height:22px; }
  .modal-titles{ flex:1 1 auto; min-width:0; }
  .modal-filename{
    font-family:var(--mono); font-size:13.5px; font-weight:500;
    color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .modal-meta{
    font-family:var(--mono); font-size:11px; color:var(--dim);
    margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .modal-close{
    flex:0 0 auto;
    width:30px; height:30px;
    display:grid; place-items:center;
    border-radius:8px;
    color:var(--dim);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .modal-close:hover{ color:var(--ink); background:rgba(228,235,241,0.07); }

  .modal-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:16px;
    display:flex; flex-direction:column;
  }
  .modal-footer{
    flex:0 0 auto;
    padding:12px 14px;
    border-top:1px solid var(--line);
    display:flex; justify-content:flex-end;
  }
  .modal-footer:empty{ display:none; }

  .btn-download{
    display:flex; align-items:center; gap:7px;
    padding:8px 14px;
    background:rgba(110,231,176,0.12);
    border:1px solid rgba(110,231,176,0.35);
    border-radius:9px;
    color:var(--signal);
    font-family:var(--mono); font-size:12px;
    transition:background var(--dur) var(--ease);
  }
  .btn-download:hover{ background:rgba(110,231,176,0.2); }

  /* ---------- viewers ---------- */
  .fade-target{ opacity:0; transition:opacity 260ms var(--ease); }
  .fade-target.show{ opacity:1; }

  .viewer-image{ position:relative; display:flex; align-items:center; justify-content:center; min-height:120px; }
  .viewer-image img{ max-width:100%; max-height:56vh; border-radius:10px; display:block; }

  .viewer-text{
    margin:0;
    font-family:var(--mono); font-size:12.5px; line-height:1.6;
    color:var(--ink);
    white-space:pre-wrap; word-break:break-word;
    max-height:52vh; overflow-y:auto;
  }

  .viewer-fallback{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:30px 10px;
    color:var(--dim);
    text-align:center;
  }
  .viewer-fallback .icon-lg{ color:var(--c-other); }
  .viewer-fallback p{ margin:0; font-size:13px; }

  .viewer-error{
    margin:10px 0 0; color:var(--flag);
    font-family:var(--mono); font-size:12px; text-align:center;
  }

  .mini-spinner{
    width:22px; height:22px; margin:30px auto;
    border-radius:50%;
    border:2.5px solid rgba(228,235,241,0.15);
    border-top-color:var(--signal);
    animation:spin .8s linear infinite;
  }

  /* ---------- media player (shared audio/video) ---------- */
  .player{ display:flex; flex-direction:column; gap:14px; }
  .player-visual{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--line);
  }
  .player-visual-audio{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    min-height:150px;
    color:var(--c-audio);
    background:
      radial-gradient(120px 90px at 50% 20%, color-mix(in srgb, var(--c-audio) 16%, transparent), transparent);
  }
  .icon-note{ width:34px; height:34px; }
  .eq{ display:flex; align-items:flex-end; gap:4px; height:22px; }
  .eq span{
    width:4px; height:6px; border-radius:2px;
    background:var(--c-audio);
    opacity:.55;
  }
  @media (prefers-reduced-motion: no-preference){
    .player.is-playing .eq span{ animation:eq 900ms ease-in-out infinite; opacity:1; }
    .player.is-playing .eq span:nth-child(1){ animation-delay:0ms; }
    .player.is-playing .eq span:nth-child(2){ animation-delay:150ms; }
    .player.is-playing .eq span:nth-child(3){ animation-delay:300ms; }
    .player.is-playing .eq span:nth-child(4){ animation-delay:80ms; }
  }

  .player-video{ width:100%; max-height:44vh; display:block; background:#000; }
  .player-overlay-btn{
    position:absolute; inset:0;
    display:grid; place-items:center;
    background:rgba(6,9,13,0.28);
    color:#fff;
    transition:opacity var(--dur) var(--ease);
  }
  .player-overlay-btn[hidden]{ display:none; }
  .player-buf-spinner{ position:absolute; inset:0; margin:auto; width:26px; height:26px; }
  .player-buf-spinner[hidden]{ display:none; }

  /* ---- progress row ---- */
  .player-progress{ display:flex; align-items:center; gap:8px; }
  .player-time{ flex:0 0 auto; font-family:var(--mono); font-size:11px; color:var(--dim); min-width:30px; }
  .player-time.dur{ text-align:right; cursor:pointer; border-radius:4px; user-select:none; }
  .player-time.dur:hover, .player-time.dur:focus-visible{ color:var(--ink); outline:none; }

  .seek-track{ position:relative; flex:1 1 auto; height:16px; display:flex; align-items:center; }
  .seek-bg, .seek-buffered, .seek-played{
    position:absolute; left:0; height:4px; border-radius:99px; pointer-events:none;
  }
  .seek-bg{ right:0; background:var(--line-strong); }
  .seek-buffered{ width:0%; background:rgba(228,235,241,0.24); }
  .seek-played{ width:0%; background:var(--signal); }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    height:4px; border-radius:99px;
    background:var(--line-strong);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px; height:13px; border-radius:50%;
    background:var(--signal);
    border:none;
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%;
    background:var(--signal); border:none; cursor:pointer;
  }
  .player-seek{
    position:relative; z-index:2; width:100%; height:16px; margin:0;
    background:transparent;
  }
  .player-seek::-webkit-slider-runnable-track{ background:transparent; height:4px; }
  .player-seek::-moz-range-track{ background:transparent; height:4px; }

  /* ---- controls row ---- */
  .player-controls{ display:flex; align-items:center; gap:8px; }
  .player-playpause{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:50%;
    display:grid; place-items:center;
    background:var(--signal);
    color:#06110c;
  }
  .player-playpause .icon-sm{ width:14px; height:14px; }
  .player-mute-btn, .player-fs-btn{
    flex:0 0 auto; width:28px; height:28px; border-radius:8px;
    display:grid; place-items:center; color:var(--dim);
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .player-mute-btn:hover, .player-fs-btn:hover{ color:var(--ink); background:rgba(228,235,241,0.06); }
  .player-vol{ flex:0 0 56px; width:56px; }
  .player-spacer{ flex:1 1 auto; }
  .player-speed-btn{
    flex:0 0 auto; padding:5px 9px; border-radius:8px;
    font-family:var(--mono); font-size:11.5px; color:var(--dim);
    border:1px solid var(--line);
    transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .player-speed-btn:hover{ color:var(--ink); border-color:var(--line-strong); }
  @media (max-width:380px){ .player-vol{ display:none; } }

  /* ---- fullscreen mode (video) ---- */
  .player:fullscreen{
    background:#000;
    display:flex; flex-direction:column; justify-content:center;
    padding:14px; gap:0;
  }
  .player:fullscreen .player-visual{ flex:1 1 auto; border-radius:0; border:none; min-height:0; }
  .player:fullscreen .player-video{ max-height:100%; height:100%; object-fit:contain; }
  .player:fullscreen .player-progress, .player:fullscreen .player-controls{
    position:relative; z-index:3; background:transparent; padding:10px 4px 0;
  }

  /* ==========================================================
     CONTEXT MENU
     ========================================================== */
  .ctx-menu{
    position:fixed; z-index:90;
    min-width:172px;
    padding:6px;
    background:var(--panel-solid);
    border:1px solid var(--line-strong);
    border-radius:12px;
    box-shadow:0 16px 40px -14px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(4px) scale(.98);
    transition:opacity 160ms var(--ease), transform 160ms var(--ease);
  }
  .ctx-menu.show{ opacity:1; transform:translateY(0) scale(1); }
  .ctx-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:9px 10px;
    border-radius:8px;
    color:var(--ink);
    font-family:var(--mono); font-size:12.5px;
    text-align:left;
    transition:background var(--dur) var(--ease);
  }
  .ctx-item:hover, .ctx-item:focus-visible{ background:rgba(228,235,241,0.08); outline:none; }
  .ctx-item svg{ color:var(--dim); flex-shrink:0; }
  .ctx-sep{ height:1px; margin:5px 4px; background:var(--line); }

  /* ==========================================================
     TOAST
     ========================================================== */
  .toast{
    position:fixed; left:50%;
    bottom:calc(60px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(6px);
    z-index:120;
    padding:8px 14px;
    max-width:calc(100vw - 32px);
    background:var(--panel-solid);
    border:1px solid var(--line-strong);
    border-radius:999px;
    font-family:var(--mono); font-size:12px;
    color:var(--ink);
    text-align:center;
    opacity:0;
    transition:opacity 180ms var(--ease), transform 180ms var(--ease);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ==========================================================
     PROPERTIES
     ========================================================== */
  .props{ display:flex; flex-direction:column; }
  .props-row{
    display:flex; justify-content:space-between; gap:14px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:12.5px;
  }
  .props-row:last-child{ border-bottom:none; }
  .props-key{ color:var(--dim); flex:0 0 auto; }
  .props-val{ color:var(--ink); text-align:right; word-break:break-all; }

  /* ==========================================================
     ICONS
     ========================================================== */
  .icon, .icon-sm, .icon-xs, .icon-lg{ display:block; flex-shrink:0; }
  .icon{ width:24px; height:24px; }
  .icon-sm{ width:16px; height:16px; }
  .icon-xs{ width:11px; height:11px; }
  .icon-lg{ width:38px; height:38px; }

  /* ==========================================================
     ANIMATIONS
     ========================================================== */
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes scan{
    from{ opacity:1; top:-30%; }
    to{ opacity:0; top:110%; }
  }
  @keyframes eq{
    0%, 100%{ height:6px; }
    50%{ height:20px; }
  }
  @media (prefers-reduced-motion: reduce){
    .caret{ animation:none; opacity:1; }
    .grid{ transition:none; }
    .fade-target{ transition:none; }
    .modal-backdrop, .modal-panel, .tooltip{ transition:none; }
  }

  /* ==========================================================
     RESPONSIVE
     ========================================================== */
  @media (max-width:480px){
    .window{ width:100vw; margin:0; height:100vh; height:100dvh; max-height:none; border-radius:0; border-left:none; border-right:none; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(74px, 1fr)); }
  }
</style>
</head>

  <!-- ================================================================
       ENGINE — rendering, navigation, tooltips, players. You
       shouldn't need to edit this to add files, only to change
       how the app behaves.
       ================================================================ -->
  <script id="engine-section">
    /* ==============================================================
       ELEMENT REFS
       ============================================================== */
    const grid = document.getElementById("grid");
    const emptyState = document.getElementById("emptyState");
    const breadcrumb = document.getElementById("breadcrumb");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const statusBar = document.getElementById("statusBar");
    const statusText = document.getElementById("statusText");
    const tooltip = document.getElementById("tooltip");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalIcon = document.getElementById("modalIcon");
    const modalFilename = document.getElementById("modalFilename");
    const modalMeta = document.getElementById("modalMeta");
    const modalBody = document.getElementById("modalBody");
    const modalFooter = document.getElementById("modalFooter");
    const modalClose = document.getElementById("modalClose");
    const ctxMenu = document.getElementById("ctxMenu");
    const toastEl = document.getElementById("toast");

    /* ==============================================================
       HELPERS
       ============================================================== */
    const ICON_ID = { folder:"folder", audio:"audio", video:"video", image:"image", text:"text", other:"file" };
    const TYPE_BY_EXT = {
      mp3:"audio", wav:"audio", ogg:"audio", m4a:"audio", flac:"audio",
      mp4:"video", webm:"video", mov:"video",
      png:"image", jpg:"image", jpeg:"image", webp:"image", gif:"image", svg:"image",
      txt:"text", md:"text", log:"text", json:"text",
    };

    function extOf(name){
      const m = /\.([a-z0-9]+)$/i.exec(name);
      return m ? m[1].toLowerCase() : "";
    }
    function resolveFileType(node){
      return node.fileType || TYPE_BY_EXT[extOf(node.name)] || "other";
    }
    function labelForType(type){
      const map = { folder:"Folder", audio:"Audio", video:"Video", image:"Image", text:"Text", other:"File" };
      return map[type] || "File";
    }
    function sizeOf(node){
      if (typeof node.size === "number") return node.size;
      if (typeof node.content === "string") return new Blob([node.content]).size;
      return null;
    }
    function formatBytes(b){
      if (b === 0) return "0 B";
      if (b == null) return "\u2014";
      const units = ["B","KB","MB","GB"];
      let i = 0, v = b;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(v < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
    }
    function formatDate(iso){
      if (!iso) return "\u2014";
      const d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
      if (isNaN(d)) return iso;
      return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    }
    function formatTime(t){
      if (!isFinite(t) || t < 0) return "0:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function folderStats(node){
      const children = node.children || [];
      let totalBytes = 0;
      children.forEach(c => {
        if (c.type !== "folder") {
          const s = sizeOf(c);
          if (typeof s === "number") totalBytes += s;
        }
      });
      let created = node.dateCreated;
      if (!created) {
        const dates = children.map(c => c.dateCreated).filter(Boolean).sort();
        created = dates[0] || null;
      }
      return { count: children.length, totalBytes, created };
    }
    function describeNode(node, type){
      if (node.type === "folder") {
        const c = (node.children || []).length;
        return `${node.name}, folder, ${c} item${c === 1 ? "" : "s"}`;
      }
      const sz = sizeOf(node);
      return `${node.name}, ${type} file${sz != null ? ", " + formatBytes(sz) : ""}`;
    }

    /* ==============================================================
       ICON BUILDING
       ============================================================== */
    function defaultIconSvg(type){
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "icon");
      const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
      use.setAttribute("href", "#i-" + (ICON_ID[type] || "file"));
      svg.appendChild(use);
      return svg;
    }
    function buildIcon(node, type){
      if (node.icon) {
        const img = document.createElement("img");
        img.src = node.icon;
        img.alt = "";
        img.loading = "lazy";
        img.addEventListener("error", () => { img.replaceWith(defaultIconSvg(type)); }, { once:true });
        return img;
      }
      return defaultIconSvg(type);
    }

    /* ==============================================================
       NAVIGATION STATE
       ============================================================== */
    let pathStack = [fileSystem];
    let navTimer = null;

    function currentFolder(){ return pathStack[pathStack.length - 1]; }

    function goTo(newStack){
      showLoading();
      grid.classList.remove("in");
      clearTimeout(navTimer);
      navTimer = setTimeout(() => {
        pathStack = newStack;
        searchInput.value = "";
        renderBreadcrumb();
        renderGrid();
        hideLoading();
      }, CONFIG.loadingDelay);
    }
    function openFolder(node){ goTo([...pathStack, node]); }
    function goToCrumb(i){ goTo(pathStack.slice(0, i + 1)); }
    function goHome(){ goTo([fileSystem]); }

    /* ==============================================================
       BREADCRUMB
       ============================================================== */
    function renderBreadcrumb(){
      breadcrumb.innerHTML = "";
      pathStack.forEach((node, i) => {
        if (i > 0) {
          const sep = document.createElement("span");
          sep.className = "crumb-sep";
          sep.innerHTML = '<svg class="icon-sm"><use href="#i-chevron"></use></svg>';
          sep.setAttribute("aria-hidden", "true");
          breadcrumb.appendChild(sep);
        }
        const isLast = i === pathStack.length - 1;
        const btn = document.createElement("button");
        btn.className = "crumb" + (isLast ? " is-current" : "");
        btn.textContent = node.name;
        btn.setAttribute("aria-current", isLast ? "page" : "false");
        if (isLast) {
          btn.disabled = true;
          const caret = document.createElement("span");
          caret.className = "caret";
          caret.textContent = "\u258c";
          caret.setAttribute("aria-hidden", "true");
          btn.appendChild(caret);
        } else {
          btn.addEventListener("click", () => goToCrumb(i));
        }
        breadcrumb.appendChild(btn);
      });
    }

    /* ==============================================================
       GRID
       ============================================================== */
    function getDisplayList(node){
      let items = (node.children || []).slice();
      const q = searchInput.value.trim().toLowerCase();
      if (q) items = items.filter(n => n.name.toLowerCase().includes(q));

      const folders = items.filter(n => n.type === "folder");
      const files = items.filter(n => n.type !== "folder");
      const mode = sortSelect.value;

      function cmp(a, b){
        switch (mode) {
          case "name-asc": return a.name.localeCompare(b.name);
          case "name-desc": return b.name.localeCompare(a.name);
          case "date-new": return (b.dateCreated || "").localeCompare(a.dateCreated || "");
          case "date-old": return (a.dateCreated || "").localeCompare(b.dateCreated || "");
          case "size-desc": return (sizeOf(b) || 0) - (sizeOf(a) || 0);
          default: return 0;
        }
      }
      folders.sort(cmp);
      files.sort(cmp);
      return [...folders, ...files];
    }

    function renderGrid(){
      const list = getDisplayList(currentFolder());
      grid.innerHTML = "";
      emptyState.hidden = list.length !== 0;
      if (list.length === 0) {
        const q = searchInput.value.trim();
        emptyState.textContent = q ? `No matches for "${q}".` : "This folder is empty.";
      } else {
        const frag = document.createDocumentFragment();
        list.forEach(node => frag.appendChild(buildTile(node)));
        grid.appendChild(frag);
      }
      requestAnimationFrame(() => grid.classList.add("in"));
    }

    function buildTile(node){
      const type = node.type === "folder" ? "folder" : resolveFileType(node);
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.dataset.type = type;
      tile.setAttribute("role", "button");
      tile.setAttribute("tabindex", "0");
      tile.setAttribute("aria-label", describeNode(node, type));

      const iconWrap = document.createElement("div");
      iconWrap.className = "tile-icon";
      iconWrap.appendChild(buildIcon(node, type));
      if (node.badge) {
        const badge = document.createElement("span");
        badge.className = "tile-badge tile-badge-" + node.badge;
        badge.innerHTML = '<svg class="icon-xs"><use href="#i-warn"></use></svg>';
        badge.setAttribute("aria-hidden", "true");
        iconWrap.appendChild(badge);
      }

      const label = document.createElement("div");
      label.className = "tile-label";
      label.textContent = node.name;

      tile.appendChild(iconWrap);
      tile.appendChild(label);
      wireTileInteractions(tile, node, type);
      return tile;
    }

    function wireTileInteractions(tile, node, type){
      let hoverTimer = null, peekTimer = null, menuTimer = null;
      let longPressed = false, menuOpened = false;
      let touchX = 0, touchY = 0;

      function activate(){
        if (node.type === "folder") openFolder(node);
        else openFile(node, type);
      }

      tile.addEventListener("click", () => {
        if (menuOpened) { menuOpened = false; return; }
        if (longPressed) { longPressed = false; return; }
        activate();
      });
      tile.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
      });
      tile.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, node, type);
      });

      tile.addEventListener("mouseenter", () => {
        hoverTimer = setTimeout(() => showTooltip(tile, node, type), 450);
      });
      tile.addEventListener("mouseleave", () => { clearTimeout(hoverTimer); hideTooltip(); });
      tile.addEventListener("focus", () => showTooltip(tile, node, type));
      tile.addEventListener("blur", hideTooltip);

      // Touch: a short hold (~450ms) peeks the tooltip; holding on to
      // ~1.2s escalates into the context menu (copy / download / properties).
      tile.addEventListener("touchstart", (e) => {
        longPressed = false; menuOpened = false;
        const t = e.touches[0];
        touchX = t.clientX; touchY = t.clientY;
        peekTimer = setTimeout(() => { longPressed = true; showTooltip(tile, node, type); }, 450);
        menuTimer = setTimeout(() => {
          menuOpened = true;
          hideTooltip();
          showContextMenu(touchX, touchY, node, type);
        }, 1200);
      }, { passive:true });
      tile.addEventListener("touchend", (e) => {
        clearTimeout(peekTimer); clearTimeout(menuTimer);
        if (menuOpened || longPressed) e.preventDefault();
      });
      tile.addEventListener("touchmove", () => { clearTimeout(peekTimer); clearTimeout(menuTimer); });
    }

    /* ==============================================================
       TOOLTIP
       ============================================================== */
    let tooltipOwner = null, tooltipAutoHide = null;

    function buildTooltipContent(node, type){
      const rows = [];
      rows.push(`<div class="tt-name">${escapeHtml(node.name)}</div>`);
      rows.push(`<div class="tt-type">${labelForType(node.type === "folder" ? "folder" : type)}</div>`);
      if (node.type === "folder") {
        const c = (node.children || []).length;
        rows.push(`<div class="tt-row"><span>Items</span><span>${c}</span></div>`);
      } else {
        const sz = sizeOf(node);
        if (sz != null) rows.push(`<div class="tt-row"><span>Size</span><span>${formatBytes(sz)}</span></div>`);
      }
      if (node.dateCreated) rows.push(`<div class="tt-row"><span>Created</span><span>${formatDate(node.dateCreated)}</span></div>`);
      if (node.artist) rows.push(`<div class="tt-row"><span>Artist</span><span>${escapeHtml(node.artist)}</span></div>`);
      if (node.badge === "warning") rows.push(`<div class="tt-warn"><svg class="icon-xs"><use href="#i-warn"></use></svg>Flagged</div>`);
      return rows.join("");
    }

    function positionTooltip(tile){
      const r = tile.getBoundingClientRect();
      requestAnimationFrame(() => {
        const tr = tooltip.getBoundingClientRect();
        let l = r.left + r.width / 2 - tr.width / 2;
        l = Math.max(8, Math.min(l, window.innerWidth - tr.width - 8));
        let t = r.top - tr.height - 10;
        if (t < 8) t = r.bottom + 10;
        tooltip.style.left = l + "px";
        tooltip.style.top = t + "px";
      });
    }

    function showTooltip(tile, node, type){
      tooltipOwner = tile;
      tooltip.innerHTML = buildTooltipContent(node, type);
      tooltip.hidden = false;
      positionTooltip(tile);
      requestAnimationFrame(() => tooltip.classList.add("show"));
      clearTimeout(tooltipAutoHide);
      tooltipAutoHide = setTimeout(hideTooltip, 4000);
    }
    function hideTooltip(){
      tooltipOwner = null;
      tooltip.classList.remove("show");
      setTimeout(() => { if (!tooltip.classList.contains("show")) tooltip.hidden = true; }, 180);
    }
    document.addEventListener("touchstart", (e) => {
      if (tooltipOwner && !tooltipOwner.contains(e.target)) hideTooltip();
    }, { passive:true });

    /* ==============================================================
       STATUS BAR
       ============================================================== */
    function showLoading(){
      statusBar.classList.add("is-loading");
      statusText.textContent = "Scanning\u2026";
    }
    function hideLoading(){
      statusBar.classList.remove("is-loading");
      const stats = folderStats(currentFolder());
      const parts = [
        `${stats.count} item${stats.count === 1 ? "" : "s"}`,
        formatBytes(stats.totalBytes) + " total",
        stats.created ? "Created " + formatDate(stats.created) : "Created \u2014",
      ];
      statusText.textContent = parts.join("  \u2022  ");
    }

    /* ==============================================================
       TOAST (small confirmation, e.g. "Copied")
       ============================================================== */
    let toastTimer = null;
    function toast(msg){
      toastEl.textContent = msg;
      toastEl.hidden = false;
      requestAnimationFrame(() => toastEl.classList.add("show"));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove("show");
        setTimeout(() => { toastEl.hidden = true; }, 200);
      }, 1700);
    }

    /* ==============================================================
       DOWNLOAD + COPY
       ============================================================== */
    function buildDownloadLink(node){
      const a = document.createElement("a");
      if (node.src) {
        a.href = node.src;
      } else if (typeof node.content === "string") {
        a.href = URL.createObjectURL(new Blob([node.content], { type:"text/plain" }));
      } else {
        return null;
      }
      a.download = node.name;
      return a;
    }
    function triggerDownload(node){
      const a = buildDownloadLink(node);
      if (!a) return;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
    function blobToPng(blob){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob failed"))), "image/png");
          URL.revokeObjectURL(img.src);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(blob);
      });
    }
    async function copyImageToClipboard(node){
      try {
        const resp = await fetch(node.src);
        const blob = await resp.blob();
        if (navigator.clipboard && window.ClipboardItem) {
          try {
            await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
            toast("Copied");
            return;
          } catch (e) {
            const png = await blobToPng(blob);
            await navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
            toast("Copied");
            return;
          }
        }
        throw new Error("Clipboard API unavailable");
      } catch (err) {
        try {
          await navigator.clipboard.writeText(node.src);
          toast("Couldn't copy the image \u2014 copied the link instead");
        } catch (err2) {
          toast("Copy isn't available in this browser");
        }
      }
    }

    /* ==============================================================
       CONTEXT MENU (right-click, or long-press ~1.2s on touch)
       ============================================================== */
    let ctxMenuOpen = false;

    function buildContextMenuItems(node, type){
      const items = [];
      if (node.type !== "folder" && type === "image") {
        items.push({ label:"Copy image", icon:"i-copy", action: () => copyImageToClipboard(node) });
      }
      if (node.type !== "folder" && buildDownloadLink(node)) {
        items.push({ label:"Download", icon:"i-download", action: () => triggerDownload(node) });
      }
      items.push({ label:"Properties", icon:"i-info", sep:true, action: () => openProperties(node, type) });
      return items;
    }
    function showContextMenu(x, y, node, type){
      hideTooltip();
      const items = buildContextMenuItems(node, type);
      ctxMenu.innerHTML = "";
      items.forEach((it) => {
        if (it.sep && ctxMenu.children.length) {
          const sep = document.createElement("div");
          sep.className = "ctx-sep";
          ctxMenu.appendChild(sep);
        }
        const btn = document.createElement("button");
        btn.className = "ctx-item";
        btn.setAttribute("role", "menuitem");
        btn.innerHTML = `<svg class="icon-sm"><use href="#${it.icon}"></use></svg><span>${escapeHtml(it.label)}</span>`;
        btn.addEventListener("click", () => { hideContextMenu(); it.action(); });
        ctxMenu.appendChild(btn);
      });
      ctxMenu.hidden = false;
      ctxMenuOpen = true;
      requestAnimationFrame(() => {
        const r = ctxMenu.getBoundingClientRect();
        const l = Math.max(8, Math.min(x, window.innerWidth - r.width - 8));
        const t = Math.max(8, Math.min(y, window.innerHeight - r.height - 8));
        ctxMenu.style.left = l + "px";
        ctxMenu.style.top = t + "px";
        ctxMenu.classList.add("show");
      });
    }
    function hideContextMenu(){
      ctxMenuOpen = false;
      ctxMenu.classList.remove("show");
      setTimeout(() => { if (!ctxMenu.classList.contains("show")) ctxMenu.hidden = true; }, 160);
    }
    document.addEventListener("click", (e) => { if (ctxMenuOpen && !ctxMenu.contains(e.target)) hideContextMenu(); });
    document.addEventListener("touchstart", (e) => { if (ctxMenuOpen && !ctxMenu.contains(e.target)) hideContextMenu(); }, { passive:true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ctxMenuOpen) hideContextMenu(); });
    document.addEventListener("scroll", () => { if (ctxMenuOpen) hideContextMenu(); }, true);

    /* ==============================================================
       PROPERTIES — read-only, always pulled live from the file
       system data, so it's automatically up to date whenever you
       add, edit, or remove entries in the DATA section.
       ============================================================== */
    function openProperties(node, type){
      modalIcon.innerHTML = "";
      modalIcon.appendChild(buildIcon(node, type));
      modalFilename.textContent = node.name;
      modalMeta.textContent = "Properties";

      modalBody.innerHTML = "";
      modalFooter.innerHTML = "";
      if (modalMediaCleanup) { modalMediaCleanup(); modalMediaCleanup = null; }

      const rows = [];
      rows.push(["Name", node.name]);
      rows.push(["Type", node.type === "folder" ? "Folder" : labelForType(type)]);
      rows.push(["Location", pathStack.map((n) => n.name).join(" / ")]);
      if (node.type === "folder") {
        const stats = folderStats(node);
        rows.push(["Items", String(stats.count)]);
        rows.push(["Total size", formatBytes(stats.totalBytes)]);
      } else {
        const sz = sizeOf(node);
        rows.push(["Size", sz != null ? formatBytes(sz) : "\u2014"]);
      }
      rows.push(["Created", formatDate(node.dateCreated)]);
      if (node.artist) rows.push(["Artist", node.artist]);
      if (node.src && node.src.indexOf("data:") !== 0) rows.push(["Source", node.src]);
      if (node.badge === "warning") rows.push(["Flag", "\u26a0 Warning"]);

      const wrap = document.createElement("div");
      wrap.className = "props fade-target show";
      wrap.innerHTML = rows.map(([k, v]) =>
        `<div class="props-row"><span class="props-key">${escapeHtml(k)}</span><span class="props-val">${escapeHtml(v)}</span></div>`
      ).join("");
      modalBody.appendChild(wrap);

      const dl = buildDownloadLink(node);
      if (dl) {
        dl.className = "btn-download";
        dl.innerHTML = '<svg class="icon-sm"><use href="#i-download"></use></svg><span>Download</span>';
        modalFooter.appendChild(dl);
      }

      modalBackdrop.hidden = false;
      requestAnimationFrame(() => modalBackdrop.classList.add("show"));
      document.addEventListener("keydown", onModalKeydown);
    }

    /* ==============================================================
       MODAL / FILE VIEWERS
       ============================================================== */
    let modalMediaCleanup = null;
    let activePlayer = null; // { mediaEl, playBtn, muteBtn, fsToggle, volEl } — powers keyboard shortcuts

    function openFile(node, type){
      modalIcon.innerHTML = "";
      modalIcon.appendChild(buildIcon(node, type));
      modalFilename.textContent = node.name;

      const metaBits = [];
      const sz = sizeOf(node);
      if (sz != null) metaBits.push(formatBytes(sz));
      if (node.dateCreated) metaBits.push(formatDate(node.dateCreated));
      if (node.artist) metaBits.push(node.artist);
      modalMeta.textContent = metaBits.join("  \u2022  ");

      modalBody.innerHTML = "";
      modalFooter.innerHTML = "";
      if (modalMediaCleanup) { modalMediaCleanup(); modalMediaCleanup = null; }

      if (type === "image") renderImageViewer(node);
      else if (type === "audio") renderMediaViewer(node, "audio");
      else if (type === "video") renderMediaViewer(node, "video");
      else if (type === "text") renderTextViewer(node);
      else renderFallbackViewer(node);

      const dl = buildDownloadLink(node);
      if (dl) {
        dl.className = "btn-download";
        dl.innerHTML = '<svg class="icon-sm"><use href="#i-download"></use></svg><span>Download</span>';
        modalFooter.appendChild(dl);
      }

      modalBackdrop.hidden = false;
      requestAnimationFrame(() => modalBackdrop.classList.add("show"));
      document.addEventListener("keydown", onModalKeydown);
    }
    function closeModal(){
      modalBackdrop.classList.remove("show");
      document.removeEventListener("keydown", onModalKeydown);
      setTimeout(() => {
        modalBackdrop.hidden = true;
        if (modalMediaCleanup) { modalMediaCleanup(); modalMediaCleanup = null; }
        modalBody.innerHTML = "";
      }, 220);
    }
    function onModalKeydown(e){
      if (e.key === "Escape") { closeModal(); return; }
      if (!activePlayer) return;
      if (document.activeElement && document.activeElement.tagName === "INPUT") return;
      const { mediaEl, playBtn, muteBtn, fsToggle, volEl } = activePlayer;
      switch (e.key) {
        case " ":
          e.preventDefault(); playBtn.click(); break;
        case "ArrowRight":
          mediaEl.currentTime = Math.min(mediaEl.duration || mediaEl.currentTime, mediaEl.currentTime + 5); break;
        case "ArrowLeft":
          mediaEl.currentTime = Math.max(0, mediaEl.currentTime - 5); break;
        case "ArrowUp":
          e.preventDefault();
          mediaEl.volume = Math.min(1, mediaEl.volume + 0.1);
          if (volEl) volEl.value = Math.round(mediaEl.volume * 100);
          break;
        case "ArrowDown":
          e.preventDefault();
          mediaEl.volume = Math.max(0, mediaEl.volume - 0.1);
          if (volEl) volEl.value = Math.round(mediaEl.volume * 100);
          break;
        case "m": case "M":
          if (muteBtn) muteBtn.click(); break;
        case "f": case "F":
          if (fsToggle) fsToggle.click(); break;
      }
    }
    document.addEventListener("fullscreenchange", () => {
      if (!activePlayer || !activePlayer.fsToggle) return;
      const isFs = !!document.fullscreenElement;
      activePlayer.fsToggle.innerHTML = `<svg class="icon-sm"><use href="#${isFs ? "i-fullscreen-exit" : "i-fullscreen"}"></use></svg>`;
    });
    modalClose.addEventListener("click", closeModal);
    modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

    function buildErrorNote(msg){
      const p = document.createElement("p");
      p.className = "viewer-error";
      p.textContent = msg;
      return p;
    }

    function renderImageViewer(node){
      const wrap = document.createElement("div");
      wrap.className = "viewer-image";
      const spinner = document.createElement("div");
      spinner.className = "mini-spinner";
      wrap.appendChild(spinner);
      const img = document.createElement("img");
      img.alt = node.name;
      img.className = "fade-target";
      img.addEventListener("load", () => { spinner.remove(); img.classList.add("show"); });
      img.addEventListener("error", () => { spinner.remove(); wrap.appendChild(buildErrorNote("Couldn't load this image.")); });
      img.src = node.src || "";
      wrap.appendChild(img);
      modalBody.appendChild(wrap);
    }

    function renderTextViewer(node){
      const pre = document.createElement("pre");
      pre.className = "viewer-text fade-target";
      modalBody.appendChild(pre);
      if (typeof node.content === "string") {
        pre.textContent = node.content;
        requestAnimationFrame(() => pre.classList.add("show"));
      } else if (node.src) {
        pre.textContent = "Loading\u2026";
        fetch(node.src)
          .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
          .then(txt => { pre.textContent = txt; pre.classList.add("show"); })
          .catch(() => { pre.remove(); modalBody.appendChild(buildErrorNote("Couldn't load this file. Check the source URL.")); });
      } else {
        pre.textContent = "(empty file)";
        pre.classList.add("show");
      }
    }

    function renderFallbackViewer(node){
      const box = document.createElement("div");
      box.className = "viewer-fallback fade-target show";
      box.innerHTML = '<svg class="icon-lg"><use href="#i-file"></use></svg><p>No preview available for this file type.</p>';
      modalBody.appendChild(box);
    }

    function renderMediaViewer(node, kind){
      const root = document.createElement("div");
      root.className = "player player-" + kind;

      const visual = document.createElement("div");
      visual.className = "player-visual";

      const mediaEl = document.createElement(kind);
      mediaEl.src = node.src || "";
      mediaEl.preload = "metadata";
      mediaEl.playsInline = true;
      mediaEl.volume = 0.9;

      let overlayBtn = null;
      if (kind === "video") {
        mediaEl.className = "player-video";
        visual.appendChild(mediaEl);
        overlayBtn = document.createElement("button");
        overlayBtn.className = "player-overlay-btn";
        overlayBtn.setAttribute("aria-label", "Play");
        overlayBtn.innerHTML = '<svg class="icon-lg"><use href="#i-play"></use></svg>';
        visual.appendChild(overlayBtn);
        overlayBtn.addEventListener("click", () => togglePlay());
        mediaEl.addEventListener("click", () => togglePlay());
      } else {
        visual.classList.add("player-visual-audio");
        visual.innerHTML =
          '<svg class="icon-note"><use href="#i-audio"></use></svg>' +
          '<div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>';
        mediaEl.hidden = true;
        root.appendChild(mediaEl);
      }

      const bufSpinner = document.createElement("div");
      bufSpinner.className = "mini-spinner player-buf-spinner";
      bufSpinner.hidden = true;
      visual.appendChild(bufSpinner);

      const progress = document.createElement("div");
      progress.className = "player-progress";
      progress.innerHTML =
        '<span class="player-time cur">0:00</span>' +
        '<div class="seek-track">' +
          '<span class="seek-bg"></span>' +
          '<span class="seek-buffered"></span>' +
          '<span class="seek-played"></span>' +
          '<input type="range" class="player-seek" min="0" max="1000" value="0" aria-label="Seek">' +
        '</div>' +
        '<span class="player-time dur" tabindex="0" role="button" aria-label="Toggle remaining time">0:00</span>';

      const controls = document.createElement("div");
      controls.className = "player-controls";
      controls.innerHTML =
        '<button class="player-playpause" aria-label="Play">' +
          '<svg class="icon-sm i-play"><use href="#i-play"></use></svg>' +
          '<svg class="icon-sm i-pause" hidden><use href="#i-pause"></use></svg>' +
        '</button>' +
        '<button class="player-mute-btn" aria-label="Mute">' +
          '<svg class="icon-xs"><use href="#i-volume"></use></svg>' +
        '</button>' +
        '<input type="range" class="player-vol" min="0" max="100" value="90" aria-label="Volume">' +
        '<span class="player-spacer"></span>' +
        '<button class="player-speed-btn" aria-label="Playback speed">1\u00d7</button>';

      root.appendChild(visual);
      root.appendChild(progress);
      root.appendChild(controls);
      modalBody.appendChild(root);

      let fullscreenBtn = null;
      if (kind === "video") {
        fullscreenBtn = document.createElement("button");
        fullscreenBtn.className = "player-fs-btn";
        fullscreenBtn.setAttribute("aria-label", "Fullscreen");
        fullscreenBtn.innerHTML = '<svg class="icon-sm"><use href="#i-fullscreen"></use></svg>';
        controls.appendChild(fullscreenBtn);
        fullscreenBtn.addEventListener("click", () => {
          const req = root.requestFullscreen || root.webkitRequestFullscreen;
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (!document.fullscreenElement && req) req.call(root);
          else if (document.fullscreenElement && exit) exit.call(document);
        });
      }

      const playBtn = controls.querySelector(".player-playpause");
      const iPlay = controls.querySelector(".i-play");
      const iPause = controls.querySelector(".i-pause");
      const muteBtn = controls.querySelector(".player-mute-btn");
      const volEl = controls.querySelector(".player-vol");
      const speedBtn = controls.querySelector(".player-speed-btn");
      const seek = progress.querySelector(".player-seek");
      const bufferedFill = progress.querySelector(".seek-buffered");
      const playedFill = progress.querySelector(".seek-played");
      const curEl = progress.querySelector(".cur");
      const durEl = progress.querySelector(".dur");

      let seeking = false;
      let showRemaining = false;
      const SPEEDS = [1, 1.25, 1.5, 2, 0.5, 0.75];
      let speedIdx = 0;

      function togglePlay(){ if (mediaEl.paused) mediaEl.play().catch(() => {}); else mediaEl.pause(); }
      function setPlayingUI(playing){
        iPlay.hidden = playing; iPause.hidden = !playing;
        playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
        root.classList.toggle("is-playing", playing);
        if (overlayBtn) overlayBtn.hidden = playing;
      }
      function updateDurLabel(){
        if (!isFinite(mediaEl.duration)) { durEl.textContent = "0:00"; return; }
        durEl.textContent = showRemaining
          ? "-" + formatTime(Math.max(0, mediaEl.duration - mediaEl.currentTime))
          : formatTime(mediaEl.duration);
      }
      function updateBuffered(){
        if (!mediaEl.duration || !mediaEl.buffered.length) return;
        try {
          const end = mediaEl.buffered.end(mediaEl.buffered.length - 1);
          bufferedFill.style.width = Math.min(100, (end / mediaEl.duration) * 100) + "%";
        } catch (e) {}
      }

      playBtn.addEventListener("click", togglePlay);
      mediaEl.addEventListener("play", () => setPlayingUI(true));
      mediaEl.addEventListener("pause", () => setPlayingUI(false));
      mediaEl.addEventListener("ended", () => setPlayingUI(false));
      mediaEl.addEventListener("waiting", () => { bufSpinner.hidden = false; });
      mediaEl.addEventListener("playing", () => { bufSpinner.hidden = true; });
      mediaEl.addEventListener("canplay", () => { bufSpinner.hidden = true; });
      mediaEl.addEventListener("loadedmetadata", () => { updateDurLabel(); updateBuffered(); });
      mediaEl.addEventListener("progress", updateBuffered);
      mediaEl.addEventListener("timeupdate", () => {
        if (seeking) return;
        const pct = mediaEl.duration ? (mediaEl.currentTime / mediaEl.duration) * 100 : 0;
        playedFill.style.width = pct + "%";
        seek.value = pct * 10;
        curEl.textContent = formatTime(mediaEl.currentTime);
        updateDurLabel();
      });
      mediaEl.addEventListener("volumechange", () => {
        const muted = mediaEl.muted || mediaEl.volume === 0;
        muteBtn.innerHTML = `<svg class="icon-xs"><use href="#${muted ? "i-volume-mute" : "i-volume"}"></use></svg>`;
        muteBtn.setAttribute("aria-label", muted ? "Unmute" : "Mute");
      });
      mediaEl.addEventListener("error", () => {
        controls.hidden = true; progress.hidden = true; bufSpinner.hidden = true;
        visual.appendChild(buildErrorNote("Couldn't load this " + kind + " file."));
      });

      seek.addEventListener("input", () => {
        seeking = true;
        const pct = seek.value / 10;
        playedFill.style.width = pct + "%";
        if (mediaEl.duration) curEl.textContent = formatTime((seek.value / 1000) * mediaEl.duration);
      });
      seek.addEventListener("change", () => {
        if (mediaEl.duration) mediaEl.currentTime = (seek.value / 1000) * mediaEl.duration;
        seeking = false;
      });
      function toggleRemaining(){ showRemaining = !showRemaining; updateDurLabel(); }
      durEl.addEventListener("click", toggleRemaining);
      durEl.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleRemaining(); } });
      volEl.addEventListener("input", () => { mediaEl.muted = false; mediaEl.volume = volEl.value / 100; });
      muteBtn.addEventListener("click", () => { mediaEl.muted = !mediaEl.muted; });
      speedBtn.addEventListener("click", () => {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        mediaEl.playbackRate = SPEEDS[speedIdx];
        speedBtn.textContent = SPEEDS[speedIdx] + "\u00d7";
      });

      activePlayer = { mediaEl, playBtn, muteBtn, fsToggle: fullscreenBtn, volEl };
      modalMediaCleanup = () => {
        mediaEl.pause(); mediaEl.removeAttribute("src"); mediaEl.load();
        activePlayer = null;
      };
    }

    /* ==============================================================
       INIT
       ============================================================== */
    function buildBackground(){
      if (!CONFIG.backgroundImage) return;
      const bg = document.getElementById("bg");
      bg.style.backgroundImage = `linear-gradient(180deg, rgba(10,14,20,.55), rgba(10,14,20,.8)), url("${CONFIG.backgroundImage}")`;
      bg.classList.add("has-image");
    }

    function init(){
      buildBackground();
      renderBreadcrumb();
      showLoading();
      setTimeout(() => { renderGrid(); hideLoading(); }, CONFIG.loadingDelay);

      document.getElementById("btnHome").addEventListener("click", goHome);
      searchInput.addEventListener("input", renderGrid);
      sortSelect.addEventListener("change", renderGrid);
    }
    document.addEventListener("DOMContentLoaded", init);
  </script>

</body>
